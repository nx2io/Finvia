<ion-header class="ion-no-border" translucent>
  <ion-toolbar mode="ios">
    <ion-title color="light">Cards</ion-title>
    <ion-segment mode="ios" [value]="segmentValue">
      <ion-segment-button value="cards" content-id="cards">
        <ion-label>Cards</ion-label>
      </ion-segment-button>
      <ion-segment-button value="banks" content-id="banks">
        <ion-label>Banks</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="bg_circle"></div>
  <ion-segment-view>
    <ion-segment-content id="cards">
      <ion-row>
        <swiper [config]="bannerConfig">
          <ng-template swiperSlide *ngFor="let card of cards">
            <div class="card_details">
              <ion-img [src]="card?.company_img" />
              <div align="center">
                <ion-label>
                  <div class="acc-amt"><ion-text color="white">{{card?.card_no}}</ion-text></div>
                  <span>{{card?.card_holder}}</span>
                </ion-label>    
              </div>
              <p class="exp ion-text-start"><ion-text color="white">Currency: {{card?.currency}}</ion-text></p>
            </div>
          </ng-template>
        </swiper>
      </ion-row>
    
      <ion-list class="history">
        <ion-list-header>
          <ion-label color="light">Settings</ion-label>
        </ion-list-header>
        <ion-item-group>
          <ion-item lines="full">
            <ion-label>
              Enable Card 
            </ion-label>
            <ion-toggle aria-label="Primary toggle" slot="end" mode="ios" color="primary" [checked]="true"></ion-toggle>
          </ion-item>
        </ion-item-group>
        <ion-item-group>
          <ion-item [button]="true" lines="full" mode="ios" detail>
            <ion-label color="white">
              Change Pin 
            </ion-label>
          </ion-item>
        </ion-item-group>
        
      </ion-list>
    </ion-segment-content>
    

    <ion-segment-content id="banks">
      <ion-row>
        <swiper [config]="bannerConfig">
          <ng-template swiperSlide *ngFor="let card of cards">
            <div class="card_details">
              <ion-img [src]="card?.company_img" />
              <div align="center">
                <ion-label>
                  <div class="acc-amt"><ion-text color="white">{{card?.card_no}}</ion-text></div>
                  <span>{{card?.card_holder}}</span>
                </ion-label>    
              </div>
              <p class="exp ion-text-start"><ion-text color="white">Currency: {{card?.currency}}</ion-text></p>
            </div>
          </ng-template>
        </swiper>
      </ion-row>
    
      <ion-list class="history">
        <ion-list-header>
          <ion-label color="light">Settings</ion-label>
        </ion-list-header>
        <ion-item-group>
          <ion-item lines="full">
            <ion-label>
              Enable Card 
            </ion-label>
            <ion-toggle aria-label="Primary toggle" slot="end" mode="ios" color="primary" [checked]="true"></ion-toggle>
          </ion-item>
        </ion-item-group>
        <ion-item-group>
          <ion-item [button]="true" lines="full" mode="ios" detail>
            <ion-label color="white">
              Change Pin 
            </ion-label>
          </ion-item>
        </ion-item-group>
        
      </ion-list>
    </ion-segment-content>
  </ion-segment-view>

</ion-content>
